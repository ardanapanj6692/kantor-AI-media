name: Kantor AI Media Automation

on:
  schedule:
    # Berjalan otomatis setiap jam 08:00 UTC (atur sesuai keinginan)
    - cron: '0 0 * * *'
  workflow_dispatch: # Tombol manual di GitHub biar lu bisa tes kapan aja

jobs:
  run-ai:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install google-genai requests feedparser

      - name: Run AI Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
